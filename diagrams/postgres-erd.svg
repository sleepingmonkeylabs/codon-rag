  <text x="692" y="595" fill="#fbbf24" font-size="10">PK</text><text x="716" y="595" fill="#e2e8f0">grid_run_id   UUID</text>
  <line x1="680" y1="601" x2="1020" y2="601" stroke="#1e3a5f" stroke-width="0.5"/>
