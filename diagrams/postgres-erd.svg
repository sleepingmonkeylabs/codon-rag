  <text x="42" y="595" fill="#fbbf24" font-size="10">PK</text><text x="66" y="595" fill="#e2e8f0">run_id      UUID</text>
  <line x1="30" y1="601" x2="295" y2="601" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="42" y="615" fill="#60a5fa" font-size="10">FK</text><text x="66" y="615" fill="#e2e8f0">kb_id       TEXT</text>
  <text x="42" y="629" fill="#94a3b8" font-size="10">   note        TEXT</text>
  <text x="42" y="643" fill="#4ade80" font-size="10">{}  params      JSONB</text>
  <text x="42" y="657" fill="#94a3b8" font-size="10">   status      TEXT</text>
  <text x="42" y="671" fill="#94a3b8" font-size="10">   started_at  TIMESTAMPTZ</text>
  <text x="42" y="685" fill="#94a3b8" font-size="10">   finished_at TIMESTAMPTZ</text>

