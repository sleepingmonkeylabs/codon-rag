    <rect x="340" y="545" width="300" height="185" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <rect x="340" y="545" width="300" height="28" rx="6" fill="#ec4899"/>
    <rect x="340" y="567" width="300" height="6" fill="#ec4899"/>
