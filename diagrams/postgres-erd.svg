  <line x1="700" y1="163" x2="700" y2="525" stroke="#94a3b8" stroke-width="1"/>
  <line x1="700" y1="525" x2="720" y2="525" stroke="#94a3b8" stroke-width="1"/>
  <line x1="720" y1="525" x2="720" y2="545" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- documents → chunks -->
  <line x1="295" y1="370" x2="340" y2="370" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- eval_runs → eval_samples -->
  <line x1="295" y1="617" x2="340" y2="617" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- test_questions → eval_samples (dashed = nullable) -->
  <line x1="760" y1="393" x2="720" y2="393" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="720" y1="393" x2="720" y2="641" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="720" y1="641" x2="640" y2="641" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- grid_runs → grid_cells -->
  <line x1="850" y1="675" x2="850" y2="712" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="742" width="295" height="68" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="44" y="760" fill="#94a3b8" font-size="10" font-family="'Inter','Helvetica Neue',sans-serif">Legend</text>
  <text x="44" y="776" fill="#fbbf24" font-size="10">PK</text><text x="64" y="776" fill="#64748b" font-size="10"> Primary key (UUID unless noted)</text>
  <text x="44" y="790" fill="#60a5fa" font-size="10">FK</text><text x="64" y="790" fill="#64748b" font-size="10"> Foreign key</text>
  <text x="44" y="804" fill="#f97316" font-size="10">▣  </text><text x="58" y="804" fill="#64748b" font-size="10"> BYTEA blob  ╌╌╌ nullable FK</text>
  <text x="165" y="776" fill="#4ade80" font-size="10">{}</text><text x="182" y="776" fill="#64748b" font-size="10"> JSONB (indexed)</text>
  <text x="165" y="790" fill="#e879f9" font-size="10">~  </text><text x="182" y="790" fill="#64748b" font-size="10"> vector(384) pgvector</text>
  <text x="165" y="804" fill="#a855f7" font-size="10">━  </text><text x="182" y="804" fill="#a855f7" font-size="10"> new in this step</text>
</svg>
