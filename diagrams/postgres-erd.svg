  <text x="890" y="319" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold" font-family="'Inter','Helvetica Neue',sans-serif">test_questions</text>
  <line x1="760" y1="336" x2="1020" y2="336" stroke="#334155" stroke-width="1"/>
  <text x="772" y="350" fill="#fbbf24" font-size="10">PK</text><text x="796" y="350" fill="#e2e8f0">q_id          UUID</text>
  <line x1="760" y1="356" x2="1020" y2="356" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="772" y="370" fill="#60a5fa" font-size="10">FK</text><text x="796" y="370" fill="#e2e8f0">kb_id         TEXT</text>
  <text x="772" y="384" fill="#94a3b8" font-size="10">   question      TEXT</text>
  <text x="772" y="398" fill="#94a3b8" font-size="10">   ground_truth  TEXT</text>
  <text x="772" y="412" fill="#4ade80" font-size="10">[] tags          JSONB</text>
  <text x="772" y="426" fill="#94a3b8" font-size="10">   created_at    TIMESTAMPTZ</text>
  <text x="772" y="448" fill="#64748b" font-size="9" font-style="italic">TEXT PRIMARY KEY → UUID · JSON→JSONB</text>

  <!-- ── eval_runs (bottom-left) ──────────────────────── x=30, y=545 w=260 -->
  <g filter="url(#shadow)">
