  <g filter="url(#shadow)">
    <rect x="680" y="712" width="340" height="95" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="680" y="712" width="340" height="24" rx="6" fill="#10b981"/>
    <rect x="680" y="730" width="340" height="6" fill="#10b981"/>
  </g>
  <text x="850" y="729" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" font-family="'Inter','Helvetica Neue',sans-serif">grid_cells</text>
  <line x1="680" y1="742" x2="1020" y2="742" stroke="#334155" stroke-width="1"/>
  <text x="692" y="756" fill="#fbbf24" font-size="10">PK</text><text x="716" y="756" fill="#e2e8f0">cell_id           UUID</text>
  <text x="692" y="770" fill="#60a5fa" font-size="10">FK</text><text x="716" y="770" fill="#e2e8f0">grid_run_id       UUID</text>
  <text x="692" y="784" fill="#94a3b8" font-size="10">   chunk_strategy, top_k, threshold, chunk_size</text>
  <text x="692" y="798" fill="#4ade80" font-size="10">{}  scores JSONB  [] samples JSONB   duration_s</text>

  <!-- ── Relationship lines ────────────────────────────────────────────── -->
  <!-- kbs → documents -->
  <line x1="460" y1="238" x2="460" y2="268" stroke="#94a3b8" stroke-width="1"/>
  <line x1="460" y1="268" x2="162" y2="268" stroke="#94a3b8" stroke-width="1"/>
  <line x1="162" y1="268" x2="162" y2="300" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- kbs → chunks -->
  <line x1="480" y1="238" x2="480" y2="290" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#arrow)"/>

  <!-- kbs → test_questions -->
  <line x1="600" y1="238" x2="600" y2="275" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="275" x2="890" y2="275" stroke="#94a3b8" stroke-width="1"/>
  <line x1="890" y1="275" x2="890" y2="300" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- kbs → eval_runs -->
  <line x1="400" y1="163" x2="360" y2="163" stroke="#94a3b8" stroke-width="1"/>
  <line x1="360" y1="163" x2="360" y2="525" stroke="#94a3b8" stroke-width="1"/>
  <line x1="360" y1="525" x2="162" y2="525" stroke="#94a3b8" stroke-width="1"/>
  <line x1="162" y1="525" x2="162" y2="545" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

