  <text x="352" y="595" fill="#fbbf24" font-size="10">PK</text><text x="376" y="595" fill="#e2e8f0">sample_id  UUID</text>
  <line x1="340" y1="601" x2="640" y2="601" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="352" y="615" fill="#60a5fa" font-size="10">FK</text><text x="376" y="615" fill="#e2e8f0">run_id     UUID → eval_runs</text>
  <text x="352" y="629" fill="#60a5fa" font-size="10">FK</text><text x="376" y="629" fill="#e2e8f0">q_id       UUID → test_questions</text>
  <text x="352" y="643" fill="#94a3b8" font-size="10">   question   TEXT</text>
  <text x="352" y="657" fill="#94a3b8" font-size="10">   answer     TEXT</text>
  <text x="352" y="671" fill="#4ade80" font-size="10">[] contexts  JSONB</text>
  <text x="352" y="685" fill="#4ade80" font-size="10">{}  scores    JSONB</text>
  <text x="352" y="699" fill="#94a3b8" font-size="10">   error      TEXT</text>
  <text x="352" y="713" fill="#94a3b8" font-size="10">   created_at TIMESTAMPTZ</text>
  <text x="352" y="725" fill="#64748b" font-size="9" font-style="italic">TEXT→UUID · JSON TEXT→JSONB</text>

  <!-- ── grid_runs (bottom-right) ─────────────────────── x=680, y=545 w=260 -->
  <g filter="url(#shadow)">
    <rect x="680" y="545" width="340" height="130" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="680" y="545" width="340" height="28" rx="6" fill="#10b981"/>
    <rect x="680" y="567" width="340" height="6" fill="#10b981"/>
